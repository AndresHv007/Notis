<!doctype html>
<html lang="en">

<head>
  <title>INICIAR SESION</title>
  <link rel="stylesheet" href="insesion.css">
  <meta charset="utf-8">
</head>

<body>
  <div class="container">
    <div class="title">Iniciar sesion</div>

    <form id="login-form">
      <div class="form-group">
        <span>Email</span>
        <input type="email" id="email" placeholder="Ingrese su email" required>
      </div>
      <div class="form-group">
        <span>Contraseña</span>
        <input type="password" id="password" placeholder="Ingrese su contraseña" required name="password" minlength="6"
          pattern="[A-Za-z0-9]+"
          title="La contraseña debe tener al menos 6 caracteres y solo puede contener letras y números">
      </div>
      <p>No tienes cuenta? <a href="registro.html">Registrate aqui</a></p>
      <div class="button">
        <input type="submit" value="Iniciar sesion">
      </div>
    </form>

  </div>
  </div>
  <script src="insesion.js"></script>
</body>

</html>
